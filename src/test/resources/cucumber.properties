cucumber.publish.quiet=true
# For Cucumber's own runner (IntelliJ: run a feature or scenario from the editor), which passes no glue.
# Both step packages are listed; the browser hooks only fire for scenarios tagged @browser.
# The JUnit runners (RunCucumberTest, RunSmokeTest) each name their own package instead.
# Without any glue Cucumber scans the whole classpath and warns about Byte Buddy classes (from Mockito)
# that reference JNA, which is not on the classpath.
cucumber.glue=de.sharpsharp.vendingmachine.adapter.in.cucumber,de.sharpsharp.vendingmachine.smoke
